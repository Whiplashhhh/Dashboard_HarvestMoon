    <path d="M5.5 24.5C8 15 14 7 30 2.5c-3.6 4.4-3.4 11 4.6 21.5-9.5 3.4-19.6 3.6-29.1.5Z" fill="#d8433b" stroke="#3b2616" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="30" cy="2.8" r="2.4" fill="#fff7e8" stroke="#3b2616" stroke-width="1.6"/>
    <ellipse cx="14.6" cy="32" rx="2.1" ry="2.8" fill="#3b2616"/>
